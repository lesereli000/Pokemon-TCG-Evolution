name: Mutation testing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      min_score:
        description: Minimum mutation score (0-100)
        default: '70'
      safety_model_review:
        description: Send code to the configured model (manual runs on main only)
        type: boolean
        default: false
      workers:
        description: Mutants tested at once (1-4)
        default: '4'

jobs:
  build-tool:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lesereli000/mutationtestor
          ref: 42382f1315ce51369b757a03fa462bd7b431d92a
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build mutation tester with safety support
        run: mvn -B --no-transfer-progress -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-tester-jar
          path: target/MutationTester-1.0-SNAPSHOT-jar-with-dependencies.jar
          if-no-files-found: error

  # Creates the mutation-data branch if needed and folds equivalent-mutant
  # marks saved from reports into equivalents.json.
  sync-equivalents:
    needs: build-tool
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: mutation-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mutation-tester-jar
          path: ${{ runner.temp }}/tool

      - name: Sync equivalent mutants
        run: java -cp "$RUNNER_TEMP/tool/MutationTester-1.0-SNAPSHOT-jar-with-dependencies.jar" mutationtester.ci.EquivalentsSync

  mutation:
    needs: [build-tool, sync-equivalents]
    if: ${{ !cancelled() && needs.build-tool.result == 'success' && needs.sync-equivalents.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MIN_SCORE: ${{ inputs.min_score || '70' }}
      MUTATION_WORKERS: ${{ inputs.workers || '4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: mutation-tester-jar
          path: ${{ runner.temp }}/mt
      - name: Name executable
        run: mv "$RUNNER_TEMP/mt/MutationTester-1.0-SNAPSHOT-jar-with-dependencies.jar" "$RUNNER_TEMP/mt/mutationtester.jar"

      # GUI code and GUI tests are left out: exclude_source keeps the main.ui
      # package from being mutated, and -Dtest skips its tests. The pom
      # already sets up JaCoCo, so coverage uses it (jacoco:report) instead
      # of adding a second agent.
      - name: Write config
        run: |
          cat > "$RUNNER_TEMP/mt/mutation.config" <<EOF
          source_code_directory=src/main/java/main
          exclude_source=src/main/java/main/ui
          mutator_type=CUSTOM
          custom_mutation_spec=OperatorMutations.txt
          test_command=mvn -q test -Dtest='!main/ui/**'
          coverage_command=mvn -q test jacoco:report -Dtest='!main/ui/**'
          coverage_report=target/site/jacoco/jacoco.xml
          min_mutation_score=$MIN_SCORE
          time_limit_minutes=45
          unattended_safety=skip
          EOF

      # Exit code 1 = could not run, 2 = score below min_mutation_score,
      # 3 = stopped early (time limit or cancel; the report is partial).
      - name: Run mutation testing
        working-directory: ${{ runner.temp }}/mt
        timeout-minutes: 55
        env:
          MUTATION_SAFETY_SEND_CODE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.safety_model_review && 'yes' || 'no' }}
          MUTATION_SAFETY_MODEL: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.safety_model_review && vars.MUTATION_SAFETY_MODEL || '' }}
          MUTATION_SAFETY_API_URL: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.safety_model_review && vars.MUTATION_SAFETY_API_URL || '' }}
          MUTATION_SAFETY_API_KEY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.safety_model_review && secrets.MUTATION_SAFETY_API_KEY || '' }}
        run: java -jar mutationtester.jar "$GITHUB_WORKSPACE" mutation.config

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: ${{ runner.temp }}/mt/output/report/

  # Publishes main's latest report at https://lesereli000.github.io/Pokemon-TCG-Evolution/
  publish-report:
    needs: mutation
    if: ${{ !cancelled() && needs.mutation.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mutation-report
          path: site

      - name: Add index page
        run: cp site/mutation-report-demo.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Link from the run summary
        run: echo "📄 [Mutation report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
